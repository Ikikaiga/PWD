<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Pendaftaran Peserta Lomba</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <h1>Pendaftaran Peserta Lomba</h1>
    <p class="deskripsi-atas">Isi data timmu dengan lengkap, lalu unggah karyamu sebelum menekan tombol kirim.</p>
    <form action="" method="post" enctype="multipart/form-data">
        <table>
            <tr>
                <td>
                    <label for="namatim"><strong>Nama Tim Peserta</strong></label>
                </td>
                <td>
                    <input type="text" id="namatim" name="namatim" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="ketua"><strong>Ketua Tim</strong></label>
                </td>
                <td>
                    <input type="text" id="ketua" name="ketua" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="jumlah"><strong>Banyak Anggota Tim</strong></label>
                </td>
                <td>
                    <select id="jumlah" name="jumlah">
                        <option>1 Anggota</option>
                        <option>2 Anggota</option>
                        <option>3 Anggota</option>
                        <option>4 Anggota</option>
                        <option>5 Anggota</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="telepon"><strong>Nomor HP yang Bisa Dihubungi (salah satu anggota)</strong></label>
                </td>
                <td>
                    <input type="text" id="telepon" name="telepon" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="universitas">
                        <strong>Universitas Asal</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="universitas" name="universitas" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <strong>Cabang Lomba yang Diikuti</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="coding" name="bidang"
                                value="Pemrograman" />
                        <label for="coding">Pemrograman</label>
                        <input type="checkbox" id="desain" name="bidang"
                                value="Desain Grafis" />
                        <label for="desain">Desain Grafis</label>
                    </p>
                    <p>
                        <input type="checkbox" id="video" name="bidang"
                                value="Video" />
                        <label for="video">Video</label>
                        <input type="checkbox" id="essay" name="bidang"
                                value="Esai" />
                        <label for="essay">Esai</label>
                    </p>
                </td>
            </tr>
            <tr>
                <td>
                    <strong>Status Peserta</strong>
                </td>
                <td>
                    <input type="radio" id="mahasiswa" name="peserta"
                            value="Mahasiswa" />
                    <label for="mahasiswa">Mahasiswa</label>
                    <input type="radio" id="umum" name="peserta"
                            value="Masyarakat Umum" />
                    <label for="umum">Masyarakat Umum</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="deskripsi">
                        <strong>Ringkasan Karya</strong>
                    </label>
                </td>
                <td>
                    <textarea id="deskripsi" name="deskripsi"
                            rows="10" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="alasan">
                        <strong>Motivasi Mengikuti Lomba</strong>
                    </label>
                </td>
                <td>
                    <textarea id="alasan" name="alasan"
                            rows="7" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="filekarya"><strong>Unggah Berkas Karya</strong></label>
                </td>
                <td>
                    <input type="file" id="filekarya" name="filekarya"
                            accept="application/pdf, image/jpeg, image/png" />
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" name="daftar"
                            value="Kirim Pendaftaran" />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
