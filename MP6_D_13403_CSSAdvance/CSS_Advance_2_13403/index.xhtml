<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Pendaftaran Peserta Kegiatan</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <h1>Pendaftaran Peserta Kegiatan</h1>
    <p>Lengkapi semua bagian di bawah ini agar pendaftaranmu bisa segera kami proses.</p>
    <form action="" method="post" enctype="multipart/form-data">
        <div class="identitas">
        <h2>Identitas Peserta</h2>
        <table >
            <tr>
                <td>
                    <label for="nama"><strong>Nama Lengkap Peserta</strong></label>
                </td>
                <td>
                    <input type="text" id="nama" name="nama" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="nim"><strong>Nomor Induk Mahasiswa (NIM)</strong></label>
                </td>
                <td>
                    <input type="text" id="nim" name="nim" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="prodi"><strong>Program Studi yang Diambil</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option value="Informatika">Informatika</option>
                        <option value="Sistem Informasi">Sistem Informasi</option>
                        <option value="Teknik Industri">Teknik Industri</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <strong>Gender</strong>
                </td>
                <td>
                    <input type="radio" id="lakilaki" name="gender"
                            value="Pria" />
                    <label for="lakilaki">Pria</label>
                    <input type="radio" id="perempuan" name="gender"
                            value="Wanita" />
                    <label for="perempuan">Wanita</label>
                </td>
            </tr>
        </table>
        </div>
        <div class="kegiatan">
        <h2>Kegiatan yang Dipilih</h2>
        <table>
            <tr>
                <td>
                    <strong>Format Kegiatan</strong>
                </td>
                <td>
                    <input type="radio" id="seminar" name="kegiatan"
                            value="Seminar" />
                    <label for="seminar">Seminar</label>
                    <input type="radio" id="pelatihan" name="kegiatan"
                            value="Workshop" />
                    <label for="pelatihan">Workshop</label>
                    <input type="radio" id="diskusi" name="kegiatan"
                            value="Forum Diskusi" />
                    <label for="diskusi">Forum Diskusi</label>
                </td>
            </tr>
            <tr>
                <td>
                    <strong>Topik yang Diminati</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="teknologi" name="minat"
                                value="Teknologi" />
                        <label for="teknologi">Teknologi</label>
                    </p>
                    <p>
                        <input type="checkbox" id="organisasi" name="minat"
                                value="Keorganisasian" />
                        <label for="organisasi">Keorganisasian</label>
                    </p>
                    <p>
                        <input type="checkbox" id="karier" name="minat"
                                value="Pengembangan Karier" />
                        <label for="karier">Pengembangan Karier</label>
                    </p>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="waktu"><strong>Sesi Kegiatan</strong></label>
                </td>
                <td>
                    <select id="waktu" name="waktu">
                        <option value="Pagi">Sesi Pagi</option>
                        <option value="Siang">Sesi Siang</option>
                        <option value="Sore">Sesi Sore</option>
                    </select>
                </td>
            </tr>
        </table>
        </div>
        <div class="pesan">
        <h2>Berkas dan Pesan</h2>
        <table>
            <tr>
                <td>
                    <label for="harapan">
                        <strong>Apa yang Ingin Kamu Dapatkan dari Kegiatan Ini?</strong>
                    </label>
                </td>
                <td>
                    <textarea id="harapan" name="harapan"
                            rows="7" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="bukti"><strong>Unggah Bukti Transfer</strong></label>
                </td>
                <td>
                    <input type="file" id="bukti" name="bukti" />
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" name="kirim" value="Daftar Sekarang" />
                </td>
            </tr>
        </table>
        </div>
    </form>
</body>
</html>
